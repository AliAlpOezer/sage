[project]
name = "sage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AliAlpOezer", email = "a.oezer@flex.net" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
]

[project.scripts]
sage = "sage.ask:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
