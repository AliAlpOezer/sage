[project]
name = "sage"
version = "0.1.0"
description = "RAG over technical docs, built from scratch: hybrid search, reranking and a knowledge graph behind swappable ports."
readme = "README.md"
authors = [
    { name = "AliAlpOezer", email = "a.oezer@flex.net" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.6.17",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.34.0",
]

[project.scripts]
sage = "sage.ask:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]
eval = [
    "langchain-community<0.4",
    "langchain-core<0.4",
    "langchain-openai<0.3",
    "ragas>=0.2,<0.3",
]
rerank = [
    # Day-37 BGE cross-encoder reranker. Pulls torch (CPU) — heavy; install only
    # when running the reranker:  uv sync --group rerank
    "sentence-transformers>=3.0",
]
